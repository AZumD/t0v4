<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin - Memory</title>
  <link rel="stylesheet" href="../shared/admin.css" />
</head>
<body>
  <main>
    <h1>Memory</h1>
    <pre id="stats">Loading...</pre>
  </main>
  <script>
    fetch('/api/admin/memory/stats').then(r => r.json()).then(j => {
      document.getElementById('stats').textContent = JSON.stringify(j, null, 2);
    });
  </script>
</body>
</html>
